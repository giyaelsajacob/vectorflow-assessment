services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vectorflow
      POSTGRES_PASSWORD: vectorflow
      POSTGRES_DB: vectorflow
    ports:
      - "5432:5432"
    volumes:
      - vectorflow_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  vectorflow_pg:
